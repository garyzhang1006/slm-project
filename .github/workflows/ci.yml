name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m cognition_slm.audit --train data/demo.jsonl --eval data/eval.jsonl
      - run: python -m cognition_slm.train --data data/demo.jsonl --eval-data data/eval.jsonl --steps 4 --warmup-steps 2 --dry-run
